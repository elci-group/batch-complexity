[package]
name = "batch-complexity"
version = "0.1.0"
edition = "2024"
description = "Deterministic, no-LLM complexity scoring for a telemetry batch, used to route inference requests to the smallest model that can handle them reliably. Shared between dreamseq (client) and dreamsequence-api (server)."
license = "MIT"

[lib]
name = "batch_complexity"
path = "src/lib.rs"

[[bin]]
name = "batch-complexity"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
regex = "1.0"
once_cell = "1.19"
